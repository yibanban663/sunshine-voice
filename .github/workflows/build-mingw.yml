name: Build Windows (MinGW)
permissions: {}
on: [push, workflow_dispatch]

env:
  VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic
  VCPKG_COMMIT: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MinGW-w64 + tools
        shell: pwsh
        run: |
          choco install -y mingw nasm
          # CMake >= 4.4 breaks vcpkg's find_package wrapper (infinite
          # include/_find_package recursion) -> use official 3.31.6 zip instead
          $cmakeZip = "$env:RUNNER_TEMP\cmake-3.31.6-windows-x86_64.zip"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip" -OutFile $cmakeZip
          Expand-Archive $cmakeZip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\cmake-3.31.6-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\ProgramData\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\cmake-3.31.6-windows-x86_64\bin\cmake.exe" --version
          gcc --version

      - name: Setup vcpkg manually
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}/vcpkg
          git -C ${{ runner.workspace }}/vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C ${{ runner.workspace }}/vcpkg checkout $env:VCPKG_COMMIT
          & ${{ runner.workspace }}/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=${{ runner.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/vcpkg/installed
          key: vcpkg-installed-x64-mingw-dynamic-${{ env.VCPKG_COMMIT }}

      - name: Install packages
        shell: pwsh
        run: |
          $vcpkg = "${{ runner.workspace }}/vcpkg/vcpkg.exe"
          & $vcpkg install boost-asio:x64-mingw-dynamic boost-filesystem:x64-mingw-dynamic boost-interprocess:x64-mingw-dynamic boost-json:x64-mingw-dynamic boost-log:x64-mingw-dynamic boost-program-options:x64-mingw-dynamic boost-property-tree:x64-mingw-dynamic boost-random:x64-mingw-dynamic boost-regex:x64-mingw-dynamic boost-thread:x64-mingw-dynamic boost-uuid:x64-mingw-dynamic openssl:x64-mingw-dynamic opus:x64-mingw-dynamic

      - name: Configure + Build
        shell: cmd
        run: |
          set PATH=%RUNNER_TEMP%\cmake-3.31.6-windows-x86_64\bin;C:\ProgramData\mingw\mingw64\bin;C:\Program Files\NASM;%PATH%
          set CC=gcc
          set CXX=g++

          cd /d %GITHUB_WORKSPACE%
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=gcc ^
            -DCMAKE_CXX_COMPILER=g++ ^
            -DCMAKE_TOOLCHAIN_FILE=%RUNNER_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic ^
            -DSUNSHINE_USE_STATIC_QT=OFF ^
            -DBUILD_TESTS=OFF -DBUILD_TESTING=OFF

          cmake --build . --target sunshine -j%NUMBER_OF_PROCESSORS%

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-mingw-x64
          path: |
            build/sunshine.exe
            build/*.dll
          if-no-files-found: warn
