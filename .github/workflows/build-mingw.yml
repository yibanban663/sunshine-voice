name: Build Windows (MinGW)
permissions: {}
on: [push, workflow_dispatch]

env:
  PYTHON_VERSION: '3.14'

jobs:
  build_windows:
    name: Windows-AMD64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget

      - name: Update Windows dependencies
        env:
          TOOLCHAIN: ucrt-x86_64
        run: |
          pacman -Syu --noconfirm \
            git \
            mingw-w64-${TOOLCHAIN}-boost \
            mingw-w64-${TOOLCHAIN}-cmake \
            mingw-w64-${TOOLCHAIN}-cppwinrt \
            mingw-w64-${TOOLCHAIN}-curl-winssl \
            mingw-w64-${TOOLCHAIN}-doxygen \
            mingw-w64-${TOOLCHAIN}-gcc \
            mingw-w64-${TOOLCHAIN}-graphviz \
            mingw-w64-${TOOLCHAIN}-miniupnpc \
            mingw-w64-${TOOLCHAIN}-nlohmann-json \
            mingw-w64-${TOOLCHAIN}-onevpl \
            mingw-w64-${TOOLCHAIN}-openssl \
            mingw-w64-${TOOLCHAIN}-opus \
            mingw-w64-${TOOLCHAIN}-toolchain \
            mingw-w64-${TOOLCHAIN}-qt6-static \
            mingw-w64-${TOOLCHAIN}-MinHook \
            mingw-w64-${TOOLCHAIN}-nsis

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5880  # v10.3.0
        with:
          enable-cache: true

      - name: Sync Python tools
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv sync --locked --no-python-downloads --no-install-project

      - name: Build Windows
        env:
          BRANCH: main
          BUILD_VERSION: x-ss-voice-1.0
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets
          ninja -C build

      - name: Package
        run: |
          cd build
          cpack -G ZIP
          mkdir -p ../artifacts
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/Sunshine-Windows-AMD64-lite.zip || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-mingw-x64
          path: |
            artifacts/*.zip
            build/sunshine.exe
            build/*.dll
          if-no-files-found: warn
